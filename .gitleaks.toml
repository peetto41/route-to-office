title = "route-to-office gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "openrouteservice-api-key"
# ORS v2 dashboard keys are a base64-encoded JSON blob, so they consistently start with
# "eyJvcmci" (base64 for the literal `{"org"`). Verify this against your own issued key
# and adjust if ORS's format has changed — this is a best-effort narrow rule; the
# default gitleaks ruleset's generic-api-key/high-entropy rules (enabled via
# `useDefault` above) are the real safety net regardless of whether this specific
# pattern still matches.
description = "OpenRouteService API key"
regex = '''eyJvcmci[0-9A-Za-z+/=_-]{20,}'''
tags = ["key", "openrouteservice"]

[allowlist]
description = "Known-safe placeholders and example files"
paths = [
  '''(.*/)?\.env\.example$''',
  '''(.*/)?assets/env\.example$''',
]
regexes = [
  '''eyJvcmci\.\.\.''',
  '''YOUR_ORS_API_KEY''',
]
